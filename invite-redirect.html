<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドライバー招待</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f4f8; color: #333; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; box-sizing: border-box; }
        .card { background: white; padding: 30px 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); width: 100%; max-width: 360px; text-align: center; }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h2 { font-size: 18px; font-weight: bold; margin: 0 0 10px; color: #222; }
        p { font-size: 14px; color: #666; margin: 0 0 16px; line-height: 1.6; }
        .status-error { color: #e05c2a; }
        .btn-line { display: block; width: 100%; padding: 14px; background: #06c755; color: white; font-size: 16px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; text-decoration: none; box-sizing: border-box; }
        .btn-line:active { background: #05a847; }
        .note { font-size: 12px; color: #aaa; margin-top: 16px; }
    </style>
</head>
<body>
    <div class="card" id="card">
        <div id="content"></div>
    </div>

    <script>
        var params = new URLSearchParams(window.location.search);
        var id = params.get('id');
        var content = document.getElementById('content');

        if (!id) {
            content.innerHTML =
                '<div class="icon">❌</div>' +
                '<h2 class="status-error">招待リンクが正しくありません</h2>' +
                '<p>管理者にご確認ください。</p>';
        } else {
            var liffUrl = 'https://liff.line.me/2009986845-UC3gzTft?inviteDriverId=' + encodeURIComponent(id);
            var isLine = /Line/i.test(navigator.userAgent);

            if (isLine) {
                window.location.href = liffUrl;
            } else {
                content.innerHTML =
                    '<div class="icon">📱</div>' +
                    '<h2>LINEで開いてください</h2>' +
                    '<p>このページはLINEアプリで開く必要があります。<br>下のボタンをタップしてLINEを起動してください。</p>' +
                    '<a href="' + liffUrl + '" class="btn-line">LINEで開く</a>' +
                    '<p class="note">LINEがインストールされていない場合は、先にインストールしてください。</p>';
            }
        }
    </script>
</body>
</html>
