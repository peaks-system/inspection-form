<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドライバー連携</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f4f8; color: #333; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; box-sizing: border-box; }
        .card { background: white; padding: 30px 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); width: 100%; max-width: 360px; text-align: center; }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h2 { font-size: 18px; font-weight: bold; margin: 0 0 10px; color: #222; }
        p { font-size: 14px; color: #666; margin: 0 0 8px; line-height: 1.6; }
        .status-processing { color: #4a90d9; }
        .status-success { color: #06c755; }
        .status-error { color: #e05c2a; }
        .spinner { display: inline-block; width: 36px; height: 36px; border: 4px solid #e0e0e0; border-top-color: #4a90d9; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .btn-primary { display: block; width: 100%; padding: 12px; background: #06c755; color: white; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 16px; }
        .btn-primary:active { background: #05a847; }
        .btn-primary:disabled { opacity: 0.5; cursor: default; }
        .btn-secondary { display: block; width: 100%; padding: 12px; background: #e8e8e8; color: #555; font-size: 15px; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; margin-top: 8px; }
        .btn-secondary:active { background: #d0d0d0; }
        .btn-secondary:disabled { opacity: 0.5; cursor: default; }
        .warning-box { background: #fff8e1; border: 1px solid #ffe082; border-radius: 8px; padding: 12px; margin: 12px 0 0; text-align: left; font-size: 13px; color: #795548; line-height: 1.6; }
    </style>
</head>
<body>
    <div class="card" id="card">
        <div class="spinner" id="spinner"></div>
        <h2 class="status-processing" id="title">連携処理中...</h2>
        <p id="message">しばらくお待ちください。</p>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        var LIFF_ID = "2009986845-UC3gzTft";
        var API_URL = "https://kantan-geppo.peaks-y-seitoh.workers.dev/api/link-driver";
        var CHECK_URL = "https://kantan-geppo.peaks-y-seitoh.workers.dev/api/link-driver/check";

        function clearButtons() {
            document.querySelectorAll('.btn-primary, .btn-secondary, .warning-box').forEach(function (el) { el.remove(); });
        }

        function showError(msg) {
            document.getElementById('spinner').style.display = 'none';
            if (!document.querySelector('.icon')) {
                document.getElementById('card').insertAdjacentHTML('afterbegin', '<div class="icon">❌</div>');
            }
            document.getElementById('title').textContent = 'エラーが発生しました';
            document.getElementById('title').className = 'status-error';
            document.getElementById('message').textContent = msg;
            clearButtons();
        }

        function showSuccess() {
            document.getElementById('spinner').style.display = 'none';
            if (!document.querySelector('.icon')) {
                document.getElementById('card').insertAdjacentHTML('afterbegin', '<div class="icon">✅</div>');
            }
            document.getElementById('title').textContent = '連携が完了しました';
            document.getElementById('title').className = 'status-success';
            document.getElementById('message').textContent = 'LINEに戻ってご利用ください。';
            clearButtons();
        }

        function showConfirm(companyName, isExistingUser, inviteDriverId, userId, displayName) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('title').textContent = '連携の確認';
            document.getElementById('title').className = '';
            document.getElementById('message').textContent = companyName + 'と連携しますか？';

            var card = document.getElementById('card');

            if (isExistingUser) {
                var warning = document.createElement('div');
                warning.className = 'warning-box';
                warning.textContent = 'これまでの月報データは連携後に削除されます。必要な場合は連携前にダウンロードしてください。';
                card.appendChild(warning);
            }

            var btnYes = document.createElement('button');
            btnYes.className = 'btn-primary';
            btnYes.textContent = 'はい';

            var btnNo = document.createElement('button');
            btnNo.className = 'btn-secondary';
            btnNo.textContent = 'いいえ';

            btnYes.addEventListener('click', function () {
                btnYes.disabled = true;
                btnNo.disabled = true;
                document.getElementById('spinner').style.display = 'inline-block';
                document.getElementById('title').textContent = '連携処理中...';
                document.getElementById('title').className = 'status-processing';
                document.getElementById('message').textContent = 'しばらくお待ちください。';
                clearButtons();

                fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ inviteDriverId: inviteDriverId, userId: userId, displayName: displayName })
                })
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        if (data.success) {
                            showSuccess();
                        } else {
                            showError(data.error || '連携に失敗しました。');
                        }
                    })
                    .catch(function (err) {
                        console.error(err);
                        showError('通信エラーが発生しました。\nしばらくしてから再度お試しください。');
                    });
            });

            btnNo.addEventListener('click', function () {
                clearButtons();
                document.getElementById('title').textContent = 'キャンセルしました';
                document.getElementById('title').className = '';
                document.getElementById('message').textContent = '連携をキャンセルしました。';
            });

            card.appendChild(btnYes);
            card.appendChild(btnNo);
        }

        liff.init({ liffId: LIFF_ID })
            .then(function () {
                var params = new URLSearchParams(window.location.search);
                var inviteDriverId = params.get('inviteDriverId');

                if (!inviteDriverId) {
                    var liffState = params.get('liff.state');
                    if (liffState) {
                        var stateParams = new URLSearchParams(liffState);
                        inviteDriverId = stateParams.get('inviteDriverId');
                    }
                }

                if (!inviteDriverId) {
                    showError('招待リンクが正しくありません。\n管理者にご確認ください。');
                    return null;
                }

                if (!liff.isLoggedIn()) {
                    liff.login();
                    return null;
                }

                return liff.getProfile().then(function (profile) {
                    return { profile: profile, inviteDriverId: inviteDriverId };
                });
            })
            .then(function (result) {
                if (!result) return null;
                var profile = result.profile;
                var inviteDriverId = result.inviteDriverId;
                var checkUrl = CHECK_URL
                    + '?inviteDriverId=' + encodeURIComponent(inviteDriverId)
                    + '&userId=' + encodeURIComponent(profile.userId);
                return fetch(checkUrl)
                    .then(function (r) { return r.json(); })
                    .then(function (data) {
                        return { data: data, profile: profile, inviteDriverId: inviteDriverId };
                    });
            })
            .then(function (result) {
                if (!result) return;
                var data = result.data;
                var profile = result.profile;
                var inviteDriverId = result.inviteDriverId;
                if (!data.success) {
                    showError(data.error || '連携の確認に失敗しました。');
                    return;
                }
                showConfirm(data.companyName, data.isExistingUser, inviteDriverId, profile.userId, profile.displayName);
            })
            .catch(function (err) {
                console.error(err);
                showError('通信エラーが発生しました。\nしばらくしてから再度お試しください。');
            });
    </script>
</body>
</html>
