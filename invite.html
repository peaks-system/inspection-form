<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ドライバー連携</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #f0f4f8; color: #333; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; box-sizing: border-box; }
        .card { background: white; padding: 30px 24px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.12); width: 100%; max-width: 360px; text-align: center; }
        .icon { font-size: 48px; margin-bottom: 16px; }
        h2 { font-size: 18px; font-weight: bold; margin: 0 0 10px; color: #222; }
        p { font-size: 14px; color: #666; margin: 0 0 8px; line-height: 1.6; }
        .status-processing { color: #4a90d9; }
        .status-success { color: #06c755; }
        .status-error { color: #e05c2a; }
        .spinner { display: inline-block; width: 36px; height: 36px; border: 4px solid #e0e0e0; border-top-color: #4a90d9; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="card" id="card">
        <div class="spinner" id="spinner"></div>
        <h2 class="status-processing" id="title">連携処理中...</h2>
        <p id="message">しばらくお待ちください。</p>
    </div>

    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        const LIFF_ID = "2009986845-UC3gzTft";
        const API_URL = "https://kantan-geppo.peaks-y-seitoh.workers.dev/api/link-driver";

        function showError(msg) {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('card').insertAdjacentHTML('afterbegin', '<div class="icon">❌</div>');
            document.getElementById('title').textContent = 'エラーが発生しました';
            document.getElementById('title').className = 'status-error';
            document.getElementById('message').textContent = msg;
        }

        function showSuccess() {
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('card').insertAdjacentHTML('afterbegin', '<div class="icon">✅</div>');
            document.getElementById('title').textContent = '連携が完了しました';
            document.getElementById('title').className = 'status-success';
            document.getElementById('message').textContent = 'LINEに戻ってご利用ください。';
        }

        const params = new URLSearchParams(window.location.search);
        const inviteDriverId = params.get('inviteDriverId');

        if (!inviteDriverId) {
            liff.init({ liffId: LIFF_ID }).catch(() => {}).finally(() => {
                showError('招待リンクが正しくありません。\n管理者にご確認ください。');
            });
        } else {
            liff.init({ liffId: LIFF_ID })
                .then(() => {
                    if (!liff.isLoggedIn()) {
                        liff.login();
                        return null;
                    }
                    return liff.getProfile();
                })
                .then((profile) => {
                    if (!profile) return null;
                    return fetch(API_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            inviteDriverId: inviteDriverId,
                            userId: profile.userId,
                            displayName: profile.displayName
                        })
                    });
                })
                .then((response) => {
                    if (!response) return null;
                    return response.json();
                })
                .then((data) => {
                    if (!data) return;
                    if (data.success) {
                        showSuccess();
                    } else {
                        showError(data.error || '連携に失敗しました。');
                    }
                })
                .catch((err) => {
                    console.error(err);
                    showError('通信エラーが発生しました。\nしばらくしてから再度お試しください。');
                });
        }
    </script>
</body>
</html>
